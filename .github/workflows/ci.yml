name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v
      - name: Build & run hello world
        run: |
          dextra build examples/hello.dx -o /tmp/hello
          /tmp/hello
